# Local tools and deterministic PDF reports for the construction purchasing agent.
services:
  chantier-api:
    build:
      context: ./chantier
    image: atelier-chantier-tools:local
    working_dir: /app
    command: ["node", "server.mjs"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8788:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      REPORT_DIR: "/reports"
      REPORT_PUBLIC_BASE_URL: "http://localhost:8788"
    volumes:
      - ./local-files/chantier-reports:/reports
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
