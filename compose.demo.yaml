# Adds the interview demo to the existing local n8n instance.
# docker compose -f compose.yaml -f compose.demo.yaml up -d qualification-api
services:
  qualification-api:
    image: node:22-bookworm-slim
    working_dir: /app
    command: ["node", "server.mjs"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      DATABASE_PATH: /data/qualification.sqlite
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:3b
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/atelier-qualification
      PUBLIC_ORIGIN: http://localhost:8787
    volumes:
      - ./demo:/app:ro
      - qualification_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  qualification_data:
